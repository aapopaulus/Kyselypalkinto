<!doctype html>
<html lang="fi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f7f2">
  <title>Yksi kysymys</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #26332d;
      --muted: #68756c;
      --green: #477a5b;
      --green-dark: #356347;
      --background: #f6f7f2;
      --card: #fffefa;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      color: var(--ink);
      background:
        radial-gradient(circle at 15% 15%, #e5eee1 0, transparent 30%),
        radial-gradient(circle at 90% 85%, #f5ead8 0, transparent 28%),
        var(--background);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .card {
      width: min(100%, 520px);
      padding: clamp(32px, 7vw, 56px) clamp(24px, 7vw, 52px);
      border: 1px solid #e8ebe3;
      border-radius: 24px;
      background: var(--card);
      box-shadow: 0 14px 40px rgba(48, 65, 53, .08);
      text-align: center;
      animation: appear .5s ease both;
    }

    .heart {
      display: grid;
      width: 54px;
      height: 54px;
      margin: 0 auto 22px;
      place-items: center;
      border-radius: 18px;
      background: #edf3e9;
      color: var(--green);
      font-size: 27px;
    }

    h1 {
      margin: 0;
      font-size: clamp(30px, 7vw, 44px);
      font-weight: 700;
      letter-spacing: -.05em;
      line-height: 1.15;
    }
    h1 span { color: var(--green); }

    .buttons {
      display: flex;
      min-height: 58px;
      align-items: center;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 28px;
    }

    button, .sms-link {
      min-height: 48px;
      border: 0;
      border-radius: 14px;
      padding: 0 22px;
      font: 650 14px/1 system-ui, sans-serif;
      cursor: pointer;
      transition: transform .2s ease, background .2s ease, box-shadow .2s ease;
    }

    #yes {
      position: relative;
      z-index: 2;
      color: #fff;
      background: var(--green);
      box-shadow: 0 5px 13px rgba(71, 122, 91, .2);
      transform: scale(var(--yes-scale, 1));
    }
    #yes:hover, .sms-link:hover { background: var(--green-dark); }
    #yes:active, .sms-link:active { transform: scale(.97); }

    #no {
      color: var(--ink);
      background: #f0f1ed;
    }
    #no:hover { background: #e6e9e2; }

    .message {
      min-height: 24px;
      margin: 16px 0 0;
      color: var(--green-dark);
      font: 600 14px/1.5 system-ui, sans-serif;
    }

    .success { animation: appear .45s ease both; }
    .success .heart { animation: heartbeat 1.1s ease-in-out infinite; }
    .success h1 { font-size: clamp(32px, 7vw, 46px); }
    .subtitle {
      margin: 18px 0 24px;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.6;
    }
    .sms-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      background: var(--green);
      text-decoration: none;
    }
    .small-note { margin: 16px 0 0; color: var(--muted); font-size: 12px; line-height: 1.6; }

    @keyframes appear {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      15% { transform: scale(1.12); }
      30% { transform: scale(1); }
      45% { transform: scale(1.08); }
    }

    @media (max-width: 420px) {
      body { padding: 16px; }
      .card { border-radius: 20px; }
      .buttons { gap: 10px; }
      button { padding: 0 18px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main class="card" id="card" aria-live="polite">
    <div class="heart" aria-hidden="true">♡</div>
    <h1>Lähtisitkö<br><span>treffeille</span> kanssani?</h1>
    <div class="buttons">
      <button id="yes" type="button">Joo, mielelläni!</button>
      <button id="no" type="button">Ehkä ei</button>
    </div>
    <p class="message" id="message" role="status"></p>
  </main>

  <script>
    // Suomen maakoodi lisätään numeroon kansainvälistä SMS-linkkiä varten.
    const PHONE_NUMBER = "+358400950417";
    const SMS_TEXT = "No, millon mennään?";

    const card = document.getElementById("card");
    const yesButton = document.getElementById("yes");
    const noButton = document.getElementById("no");
    const message = document.getElementById("message");
    let noCount = 0;

    noButton.addEventListener("click", () => {
      noCount += 1;
      message.textContent = "Ei se mitään 🙂";
      yesButton.style.setProperty("--yes-scale", String(Math.min(1 + noCount * 0.18, 2.4)));
    });

    yesButton.addEventListener("click", () => {
      const recipient = PHONE_NUMBER.trim().replace(/[^+\d]/g, "");
      const smsUrl = `sms:${recipient}?&body=${encodeURIComponent(SMS_TEXT)}`;
      card.innerHTML = `
        <section class="success">
          <div class="heart" aria-hidden="true">♥</div>
          <h1>Jes!<br><span>Tästä tulee kivaa.</span></h1>
          <p class="subtitle">Laitetaanko suunnitelmat lukkoon?</p>
          <a class="sms-link" href="${smsUrl}">Laita viesti ✉</a>
          <p class="small-note">Viestissä lukee: “${SMS_TEXT}”</p>
        </section>`;
    });
  </script>
</body>
</html>
