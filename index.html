<!doctype html>
<html lang="fi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fff3f3">
  <meta property="og:title" content="Yksi pieni kysymys… 🥺">
  <meta property="og:description" content="Avaa, niin näet 💌">
  <title>Yksi pieni kysymys… 🥺</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #3b2026;
      --red: #d83c50;
      --red-dark: #b92b40;
      --background: #fff3f3;
      --card: rgba(255, 255, 255, .92);
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      padding: 24px;
      color: var(--ink);
      background:
        radial-gradient(ellipse at 12% 18%, rgba(255, 192, 198, .64), transparent 34%),
        radial-gradient(ellipse at 88% 82%, rgba(255, 213, 203, .66), transparent 35%),
        var(--background);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .background-art {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    .card {
      position: relative;
      z-index: 1;
      width: min(100%, 520px);
      padding: clamp(36px, 8vw, 64px) clamp(24px, 7vw, 52px);
      border: 1px solid rgba(255, 255, 255, .9);
      border-radius: 28px;
      background: var(--card);
      box-shadow: 0 18px 50px rgba(153, 43, 59, .12);
      text-align: center;
      backdrop-filter: blur(8px);
      animation: appear .5s ease both;
    }

    h1 {
      margin: 0;
      font-size: clamp(30px, 7vw, 46px);
      font-weight: 750;
      letter-spacing: -.05em;
      line-height: 1.15;
    }

    .buttons {
      display: flex;
      min-height: 58px;
      align-items: center;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 28px;
    }

    button, .next-link {
      min-height: 50px;
      border: 0;
      border-radius: 16px;
      padding: 0 24px;
      font: 750 15px/1 system-ui, sans-serif;
      cursor: pointer;
      transition: transform .2s ease, background .2s ease, box-shadow .2s ease;
    }

    #yes, .next-link {
      color: #fff;
      background: var(--red);
      box-shadow: 0 7px 18px rgba(216, 60, 80, .24);
    }
    #yes {
      position: relative;
      z-index: 1;
      transform: scale(var(--yes-scale, 1));
    }
    #yes:hover, .next-link:hover { background: var(--red-dark); }
    #yes:active { transform: scale(calc(var(--yes-scale, 1) * .97)); }
    .next-link:active { transform: scale(.97); }

    #no {
      color: var(--red-dark);
      background: #ffe5e7;
    }
    #no:hover { background: #ffd6da; }

    .message {
      min-height: 24px;
      margin: 16px 0 0;
      color: var(--red-dark);
      font: 650 14px/1.5 system-ui, sans-serif;
    }

    .success { animation: appear .45s ease both; }
    .success h1 { color: var(--red-dark); }
    .next-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-top: 24px;
      text-decoration: none;
    }

    @keyframes appear {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 420px) {
      body { padding: 16px; }
      .card { border-radius: 24px; }
      .buttons { gap: 10px; }
      button { padding: 0 20px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <svg class="background-art" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice" aria-hidden="true" focusable="false">
    <g fill="none" stroke="#d83c50" stroke-linecap="round" stroke-linejoin="round">
      <path d="M132 190c-25-20-56 12-4 52 52-40 21-72-4-52Z" stroke-width="3" opacity=".22"/>
      <path d="M1030 150c-22-18-49 10-4 46 45-36 18-64-4-46Z" stroke-width="3" opacity=".18"/>
      <path d="M1060 620c-27-22-60 13-5 56 55-43 22-78-5-56Z" stroke-width="3" opacity=".2"/>
      <path d="M190 650c-20-16-44 9-4 41 40-32 16-57-4-41Z" stroke-width="3" opacity=".18"/>
      <path d="M310 120c30 12 38 35 18 54m535 480c-27-13-34-33-16-50" stroke-width="2" opacity=".15"/>
    </g>
    <g fill="#d83c50" opacity=".16">
      <circle cx="275" cy="270" r="5"/><circle cx="930" cy="320" r="6"/>
      <circle cx="850" cy="120" r="4"/><circle cx="340" cy="610" r="5"/>
      <circle cx="1120" cy="390" r="4"/><circle cx="90" cy="470" r="5"/>
    </g>
  </svg>

  <main class="card" id="card" aria-live="polite">
    <h1>Yksi pieni kysymys… 🥺</h1>
    <div class="buttons">
      <button id="yes" type="button">JOO! ❤️</button>
      <button id="no" type="button">EI 💔</button>
    </div>
    <p class="message" id="message" role="status" aria-live="polite"></p>
  </main>

  <script>
    const PHONE_NUMBER = "+358400950417";
    const SMS_TEXT = "No, millon mennään?";

    const card = document.getElementById("card");
    const yesButton = document.getElementById("yes");
    const noButton = document.getElementById("no");
    const message = document.getElementById("message");
    let noCount = 0;

    noButton.addEventListener("click", () => {
      noCount += 1;
      message.textContent = "Hups, väärä vastaus 😉";
      yesButton.style.setProperty("--yes-scale", String(Math.min(1 + noCount * 0.18, 2.4)));
    });

    yesButton.addEventListener("click", () => {
      const recipient = PHONE_NUMBER.trim().replace(/[^+\d]/g, "");
      const smsUrl = `sms:${recipient}?&body=${encodeURIComponent(SMS_TEXT)}`;
      card.innerHTML = `
        <section class="success">
          <h1>Jes! 🤩</h1>
          <a class="next-link" href="${smsUrl}">Seuraava kohta</a>
        </section>`;
    });
  </script>
</body>
</html>
